<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" role="img" aria-labelledby="title desc">
  <title id="title">GrassCutters Racing Android</title>
  <desc id="desc">Icono negro y verde de una máquina de competición con visor y bandera a cuadros.</desc>
  <defs>
    <linearGradient id="tile" x1="24" y1="18" x2="164" y2="174" gradientUnits="userSpaceOnUse">
      <stop stop-color="#101811"/>
      <stop offset=".48" stop-color="#050806"/>
      <stop offset="1" stop-color="#010302"/>
    </linearGradient>
    <linearGradient id="lime" x1="47" y1="52" x2="139" y2="141" gradientUnits="userSpaceOnUse">
